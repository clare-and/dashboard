*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --greige: rgb(176, 161, 138);
  --charcoal: rgb(56, 56, 59);
  --cream: rgb(255, 252, 235);
  --black: rgb(0, 0, 0);
}

body {
  background: var(--greige);
  color: var(--black);
  font-family: 'NeueMontrealRegular', 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
}

.header {
  background: var(--charcoal);
  padding: 28px 48px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}

.header-title {
  font-family: 'GrandSlangRoman', serif;
  font-size: 32px;
  font-weight: 400;
  color: var(--cream);
  letter-spacing: -0.01em;
  line-height: 1;
}

.header-meta {
  display: flex;
  align-items: center;
  gap: 20px;
}

.header-timestamp {
  font-family: 'Inter Tight', sans-serif;
  font-size: 11px;
  color: rgba(255,252,235,0.4);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.refresh-btn {
  font-family: 'NeueMontrealRegular', sans-serif;
  font-size: 12px;
  color: rgba(255,252,235,0.55);
  background: none;
  border: none;
  cursor: pointer;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-decoration: underline;
  text-underline-offset: 3px;
  padding: 0;
  transition: color 0.15s;
}
.refresh-btn:hover { color: var(--cream); }
.refresh-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.header-rule {
  height: 1px;
  background: rgba(255,252,235,0.1);
}

.main {
  padding: 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: rgba(0,0,0,0.18);
  border-bottom: 1px solid rgba(0,0,0,0.18);
}

.widget {
  background: var(--greige);
  padding: 36px 40px;
  min-height: 340px;
  display: flex;
  flex-direction: column;
}

.widget-label {
  font-family: 'NeueMontrealMedium', sans-serif;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(0,0,0,0.4);
  margin-bottom: 12px;
}

.widget-title {
  font-family: 'GrandSlangRoman', serif;
  font-size: 22px;
  font-weight: 400;
  color: var(--black);
  margin-bottom: 18px;
  line-height: 1.05;
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.count-badge {
  font-family: 'NeueMontrealRegular', sans-serif;
  font-size: 12px;
  color: rgba(0,0,0,0.35);
  letter-spacing: 0;
}

.widget-rule {
  height: 1px;
  background: rgba(0,0,0,0.18);
  margin-bottom: 20px;
}

.widget-body {
  flex: 1;
  font-size: 14px;
  line-height: 1.5;
}

/* event-item styles moved below */

.event-name {
  font-family: 'NeueMontrealMedium', sans-serif;
  font-size: 13px;
  color: var(--black);
  line-height: 1.3;
  margin-bottom: 3px;
}

.event-meta {
  font-family: 'NeueMontrealRegular', sans-serif;
  font-size: 11px;
  color: rgba(0,0,0,0.5);
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 3px;
}

.event-link {
  font-family: 'Inter Tight', sans-serif;
  font-size: 10px;
  color: rgba(0,0,0,0.38);
  text-decoration: underline;
  text-underline-offset: 2px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.event-link:hover { color: var(--black); }

.state-loading {
  display: flex;
  align-items: center;
  gap: 10px;
  color: rgba(0,0,0,0.38);
  font-family: 'NeueMontrealRegular', sans-serif;
  font-size: 13px;
  padding: 20px 0;
}

.spinner {
  width: 13px;
  height: 13px;
  border: 1.5px solid rgba(0,0,0,0.12);
  border-top-color: rgba(0,0,0,0.45);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

.state-empty, .state-error {
  font-family: 'NeueMontrealRegular', sans-serif;
  font-size: 13px;
  color: rgba(0,0,0,0.35);
  padding: 20px 0;
}

.state-error { font-style: italic; }

.widget-placeholder .widget-title { color: rgba(0,0,0,0.2); }
.widget-placeholder .widget-label { color: rgba(0,0,0,0.18); }
.widget-placeholder .widget-rule { background: rgba(0,0,0,0.07); }

.placeholder-text {
  font-family: 'GrandSlangItalic', serif;
  font-style: italic;
  font-size: 15px;
  color: rgba(0,0,0,0.18);
  padding: 20px 0;
}

.event-item {
  padding: 11px 0;
  border-bottom: 1px solid rgba(0,0,0,0.09);
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.event-item:last-child { border-bottom: none; }

.event-poster {
  width: 42px;
  min-width: 42px;
  height: 62px;
  background: rgb(0,0,0);
  object-fit: cover;
  flex-shrink: 0;
}

.event-poster-placeholder {
  width: 42px;
  min-width: 42px;
  height: 62px;
  background: rgb(0,0,0);
  flex-shrink: 0;
}

.event-details {
  flex: 1;
  min-width: 0;
}

.footer {
  background: var(--charcoal);
  padding: 22px 48px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.footer-name {
  font-family: 'GrandSlangRoman', serif;
  font-size: 15px;
  color: rgba(255,252,235,0.25);
  font-weight: 400;
}

.footer-note {
  font-family: 'Inter Tight', sans-serif;
  font-size: 10px;
  color: rgba(255,252,235,0.18);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

@media (max-width: 768px) {
  .header { padding: 20px 24px; }
  .grid { grid-template-columns: 1fr; }
  .widget { padding: 28px 24px; min-height: 260px; }
  .footer { padding: 18px 24px; flex-direction: column; gap: 6px; }
}
</style>
</head>
<body>

<header class="header">
  <span class="header-title">Dashboard</span>
  <div class="header-meta">
    <span class="header-timestamp" id="lastUpdated">—</span>
    <button class="refresh-btn" id="refreshBtn" onclick="refreshAll()">Refresh</button>
  </div>
</header>
<div class="header-rule"></div>

<main class="main">
  <div class="grid">

    <div class="widget" id="widget-qa">
      <div class="widget-label">Film</div>
      <div class="widget-title">
        NYC Q&amp;A Screenings
        <span class="count-badge" id="qa-count"></span>
      </div>
      <div class="widget-rule"></div>
      <div class="widget-body" id="qa-body">
        <div class="state-loading"><div class="spinner"></div>Searching for screenings...</div>
      </div>
    </div>

    <div class="widget widget-placeholder">
      <div class="widget-label">—</div>
      <div class="widget-title">Coming soon</div>
      <div class="widget-rule"></div>
      <div class="widget-body"><div class="placeholder-text">Add your next alert here</div></div>
    </div>

    <div class="widget widget-placeholder">
      <div class="widget-label">—</div>
      <div class="widget-title">Coming soon</div>
      <div class="widget-rule"></div>
      <div class="widget-body"><div class="placeholder-text">Add your next alert here</div></div>
    </div>

    <div class="widget widget-placeholder">
      <div class="widget-label">—</div>
      <div class="widget-title">Coming soon</div>
      <div class="widget-rule"></div>
      <div class="widget-body"><div class="placeholder-text">Add your next alert here</div></div>
    </div>

    <div class="widget widget-placeholder">
      <div class="widget-label">—</div>
      <div class="widget-title">Coming soon</div>
      <div class="widget-rule"></div>
      <div class="widget-body"><div class="placeholder-text">Add your next alert here</div></div>
    </div>

    <div class="widget widget-placeholder">
      <div class="widget-label">—</div>
      <div class="widget-title">Coming soon</div>
      <div class="widget-rule"></div>
      <div class="widget-body"><div class="placeholder-text">Add your next alert here</div></div>
    </div>

  </div>
</main>

<footer class="footer">
  <span class="footer-name">C–A</span>
  <span class="footer-note">Personal Dashboard</span>
</footer>

<script>
// ── PASTE YOUR ANTHROPIC API KEY BELOW ──────────────────────────────────────
const ANTHROPIC_API_KEY = '';
// ────────────────────────────────────────────────────────────────────────────

function setTimestamp() {
  const now = new Date();
  const str = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
    ' · ' + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
  document.getElementById('lastUpdated').textContent = 'Last refreshed ' + str;
}

function renderEvents(events) {
  const body = document.getElementById('qa-body');
  const count = document.getElementById('qa-count');
  if (!events || events.length === 0) {
    body.innerHTML = '<div class="state-empty">No Q&A screenings found right now.</div>';
    count.textContent = '';
    return;
  }
  count.textContent = events.length;
  body.innerHTML = events.map(e => `
    <div class="event-item">
      ${e.poster_url
        ? `<img class="event-poster" src="${e.poster_url}" alt="" onerror="this.outerHTML='<div class=\"event-poster-placeholder\"></div>'">`
        : '<div class="event-poster-placeholder"></div>'
      }
      <div class="event-details">
        <div class="event-name">${e.title}</div>
        <div class="event-meta">
          ${e.date ? `<span>${e.date}</span>` : ''}
          ${e.venue ? `<span>${e.venue}</span>` : ''}
          ${e.guests ? `<span>${e.guests}</span>` : ''}
        </div>
        ${e.url ? `<a class="event-link" href="${e.url}" target="_blank">View →</a>` : ''}
      </div>
    </div>
  `).join('');
}

async function fetchScreenings() {
  const body = document.getElementById('qa-body');
  const today = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  body.innerHTML = '<div class="state-loading"><div class="spinner"></div>Searching for screenings...</div>';

  const prompt = `Today is ${today}. Search the web for ALL upcoming film screenings with Q&A events in New York City — from today onward, as far into the future as listings are available.

Look at r/filmnyc on Reddit and the full upcoming calendars of: Film Forum, IFC Center, Metrograph, Angelika, Nitehawk Cinema, BAM, Film at Lincoln Center, SVA Theatre, 92NY, Museum of the Moving Image.

Return ONLY a JSON array (no markdown, no explanation) of events:
- title: film + context e.g. "The Substance — Q&A with Coralie Fargeat"
- date: date/time string or null
- venue: venue name or null
- guests: who's doing the Q&A or null
- url: direct link or null
- poster_url: the film poster image URL as found on the listing page or venue site, or null if not found

Only events that EXPLICITLY have a Q&A. Up to 20 events, sorted soonest first. If none, return [].`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 2000,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'API error');
    let raw = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
    const start = raw.indexOf('['), end = raw.lastIndexOf(']');
    if (start === -1) throw new Error('No results');
    renderEvents(JSON.parse(raw.slice(start, end + 1)));
  } catch(err) {
    body.innerHTML = `<div class="state-error">Couldn't load screenings: ${err.message}</div>`;
  }
}

async function refreshAll() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = 'Refreshing...';
  await fetchScreenings();
  setTimestamp();
  btn.disabled = false;
  btn.textContent = 'Refresh';
}

if (!ANTHROPIC_API_KEY) {
  document.getElementById('qa-body').innerHTML =
    '<div class="state-error">Paste your Anthropic API key into the HTML file to enable live data.</div>';
  document.getElementById('lastUpdated').textContent = 'API key needed';
} else {
  document.getElementById('qa-body').innerHTML =
    '<div class="state-empty">Hit Refresh to load screenings.</div>';
  document.getElementById('lastUpdated').textContent = 'Not yet refreshed';
}
</script>
</body>
</html>
